[project]
name = "virtualizarr-processor"
version = "0.1.0"
description = "Module for ingesting virtualizarr data to Icechunk"
requires-python = ">=3.12"
dependencies = [
    "icechunk>=2.1",
    "virtualizarr>=2.7",
    "zarr>=3.2.1",
    "virtual-tiff>=0.5",
    "earthaccess-auth>=0.3.1",
    "obstore",
    "obspec-utils",
    "xarray",
    "pyarrow",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["virtualizarr_processor"]
